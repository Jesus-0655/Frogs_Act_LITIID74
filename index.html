<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="Style/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="Pages/Dashboard.html">Frog View</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Pages/Dashboard.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="Pages/Frog.html">Ranas</a></li>
            </ul>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1" style="max-width: 420px;">
        <h1 class="text-center mb-4">Frog View</h1>

        <ul class="nav nav-pills nav-fill mb-3">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabLogin">Iniciar sesión</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabRegistro">Registrarse</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tabLogin">
                <input id="loginCorreo" type="email" class="form-control mb-2" placeholder="Correo">
                <input id="loginPass" type="password" class="form-control mb-2" placeholder="Contraseña">
                <button class="btn btn-success w-100" onclick="hacerLogin()">Entrar</button>
            </div>
            <div class="tab-pane fade" id="tabRegistro">
                <input id="regCorreo" type="email" class="form-control mb-2" placeholder="Correo">
                <input id="regNametag" type="text" class="form-control mb-2" placeholder="Nametag (se mostrará a los demás)" maxlength="20">
                <input id="regPass" type="password" class="form-control mb-2" placeholder="Contraseña (mínimo 6 caracteres)">
                <button class="btn btn-success w-100" onclick="hacerRegistro()">Crear cuenta</button>
            </div>
        </div>

        <div id="mensaje" class="alert alert-danger mt-3 d-none"></div>

        <a href="Pages/Dashboard.html" class="d-block text-center mt-3">Continuar sin iniciar sesión</a>
    </main>

    <footer class="bg-light py-3">
        <p class="text-center mb-0">© 2026 Frog View. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="Js/frogs.js"></script>
    <script src="Js/auth.js"></script>
    <script>
        if (usuarioActual()) location.href = "Pages/Dashboard.html";

        function error(msg) {
            const m = document.getElementById("mensaje");
            m.textContent = msg;
            m.classList.remove("d-none");
        }

        async function hacerLogin() {
            const err = await iniciarSesion(loginCorreo.value, loginPass.value);
            err ? error(err) : location.href = "Pages/Dashboard.html";
        }

        async function hacerRegistro() {
            if (!regCorreo.value || !regNametag.value) return error("Completa todos los campos.");
            if (regPass.value.length < 6) return error("La contraseña debe tener al menos 6 caracteres.");
            const err = await registrar(regCorreo.value, regNametag.value, regPass.value);
            err ? error(err) : location.href = "Pages/Dashboard.html";
        }
    </script>
</body>
</html>
