<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Frog View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../Style/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="Dashboard.html">Frog View</a>
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link active" href="Dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="Frog.html">Ranas</a></li>
                <li class="nav-item"><a class="nav-link" href="Ranking.html">Ranking</a></li>
                <li class="nav-item"><button class="btn btn-outline-light btn-sm ms-lg-2" onclick="cerrarSesion('../index.html')">Salir</button></li>
            </ul>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <h1 id="saludo" class="mb-4"></h1>
        <div class="row g-4">
            <div class="col-md-4"><div class="card h-100 shadow-sm"><div class="card-body">
                <h6 class="text-muted">Tu voto</h6><div id="tuVoto"></div>
            </div></div></div>
            <div class="col-md-4"><div class="card h-100 shadow-sm"><div class="card-body">
                <h6 class="text-muted">Participantes</h6><p class="display-6" id="totalUsuarios"></p>
            </div></div></div>
            <div class="col-md-4"><div class="card h-100 shadow-sm"><div class="card-body">
                <h6 class="text-muted">Rana líder</h6><div id="lider"></div>
            </div></div></div>
        </div>
        <div class="text-center mt-4">
            <a href="Frog.html" class="btn btn-success">Ver ranas y votar</a>
            <a href="Ranking.html" class="btn btn-outline-success">Ver ranking</a>
        </div>
    </main>

    <footer class="bg-light py-3">
        <p class="text-center mb-0">© 2026 Frog View. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/frogs.js"></script>
    <script src="../Js/auth.js"></script>
    <script>
        const u = requerirSesion("../index.html");
        saludo.textContent = "¡Hola, " + u.nametag + "!";
        totalUsuarios.textContent = DB.leer("usuarios", []).length;

        const mio = frogs.find(f => f.id === miVoto());
        tuVoto.innerHTML = mio ? `<strong>${mio.nombre}</strong>` : `<span class="text-muted">Aún no has votado</span>`;

        const conteo = conteoVotos();
        const top = frogs.reduce((a, b) => conteo[b.id] > conteo[a.id] ? b : a);
        lider.innerHTML = conteo[top.id] > 0
            ? `<strong>${top.nombre}</strong><br>${conteo[top.id]} voto(s)`
            : `<span class="text-muted">Aún no hay votos</span>`;
    </script>
</body>
</html>
