<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../Style/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="Dashboard.html">Frog View</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Dashboard.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="Frog.html">Ranas</a></li>
                <li class="nav-item"><a class="nav-link" href="Ranking.html">Ranking</a></li>
                <li class="nav-item" id="navSesion"></li>
            </ul>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <h1 class="text-center mb-2">Ranas en peligro de extinción</h1>
        <p class="text-center text-muted mb-4">Conoce a 10 especies que necesitan nuestra atención.</p>

        <div class="row g-4" id="listaRanas"></div>
    </main>

    <!-- Chavos, si leen esto, creo que alguna de estas no estan en peligro -->
    <div class="modal fade" id="modalRana" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img id="modalImg" class="img-fluid rounded mb-3" alt="">
                    <p class="fst-italic" id="modalCientifico"></p>
                    <p><strong>Ubicación:</strong> <span id="modalUbicacion"></span></p>
                    <p id="modalDesc"></p>
                    <span class="badge" id="modalEstado"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalLogin" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center">
                <div class="modal-body p-4">
                    <p class="mb-1">Para votar por una rana necesitas iniciar sesión.</p>
                    <p class="fw-bold mb-3">¿Deseas iniciar sesión?</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">No</button>
                        <a class="btn btn-success" href="../index.html">Sí, iniciar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light py-3">
        <p class="text-center mb-0">© 2026 Frog View. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/frogs.js"></script>
    <script src="../Js/auth.js"></script>
    <script>
        pintarBotonSesion("navSesion", "../index.html");

        const contenedor = document.getElementById("listaRanas");
        const modal = new bootstrap.Modal(document.getElementById("modalRana"));
        const modalLogin = new bootstrap.Modal(document.getElementById("modalLogin"));

        function pintar() {
            contenedor.innerHTML = "";
            const voto = miVoto();
            frogs.forEach(r => {
                const e = estados[r.estado];
                const esMia = voto === r.id;
                contenedor.insertAdjacentHTML("beforeend", `
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="card h-100 shadow-sm ${esMia ? 'border-success border-3' : ''}">
                            <img src="../Img/${r.img}" class="card-img-top frog-img" alt="${r.nombre}"
                                onerror="this.src='https://placehold.co/400x250?text=Imagen+no+disponible'">
                            <div class="card-body d-flex flex-column">
                                <span class="badge ${e.clase} align-self-start mb-2">${e.texto}</span>
                                <h5 class="card-title">${r.nombre}</h5>
                                <p class="card-subtitle fst-italic text-muted mb-3">${r.cientifico}</p>
                                <div class="mt-auto d-grid gap-2">
                                    <button class="btn btn-outline-success" onclick="verRana(${r.id})">Ver más</button>
                                    <button class="btn ${esMia ? 'btn-success' : 'btn-outline-primary'}"
                                            onclick="votarPor(${r.id})">${esMia ? '✔ Tu voto' : 'Votar'}</button>
                                </div>
                            </div>
                        </div>
                    </div>`);
            });
        }

        function votarPor(id) {
            if (!usuarioActual()) {          // sin sesión: avisa, no redirige solo
                modalLogin.show();
                return;
            }
            votar(id);
            pintar();
        }

        function verRana(id) {
            const r = frogs.find(f => f.id === id);
            const e = estados[r.estado];
            document.getElementById("modalTitulo").textContent = r.nombre;
            document.getElementById("modalImg").src = "../Img/" + r.img;
            document.getElementById("modalCientifico").textContent = r.cientifico;
            document.getElementById("modalUbicacion").textContent = r.ubicacion;
            document.getElementById("modalDesc").textContent = r.desc;
            const badge = document.getElementById("modalEstado");
            badge.textContent = e.texto;
            badge.className = "badge " + e.clase;
            modal.show();
        }

        pintar();
    </script>
</body>
</html>
