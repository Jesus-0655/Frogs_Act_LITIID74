<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking | Frog View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../Style/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="Dashboard.html">Frog View</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Dashboard.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="Frog.html">Ranas</a></li>
                <li class="nav-item"><a class="nav-link active" href="Ranking.html">Ranking</a></li>
                <li class="nav-item" id="navSesion"></li>
            </ul>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1" style="max-width: 800px;">
        <h1 class="text-center mb-2">Ranking de ranas</h1>
        <p class="text-center text-muted mb-4" id="resumen"></p>

        <div id="ranking" class="d-flex flex-column gap-3"></div>

        <div class="text-center mt-4">
            <a href="Frog.html" class="btn btn-success">Ir a votar</a>
        </div>
    </main>

    <footer class="bg-light py-3">
        <p class="text-center mb-0">© 2026 Frog View. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/frogs.js"></script>
    <script src="../Js/auth.js"></script>
    <script>
        pintarBotonSesion("navSesion", "../index.html");

        const conteo = conteoVotos();
        const total = Object.values(conteo).reduce((a, b) => a + b, 0);
        const voto = miVoto();   // null si no hay sesión
        const ordenadas = [...frogs].sort((a, b) => conteo[b.id] - conteo[a.id]);

        document.getElementById("resumen").textContent =
            total + (total === 1 ? " voto registrado" : " votos registrados");

        const medallas = ["🥇", "🥈", "🥉"];
        const contenedor = document.getElementById("ranking");

        ordenadas.forEach((r, i) => {
            const votos = conteo[r.id];
            const pct = total > 0 ? Math.round((votos / total) * 100) : 0;
            const esMia = voto === r.id;
            const color = i === 0 && votos > 0 ? "bg-success" : "bg-secondary";

            contenedor.insertAdjacentHTML("beforeend", `
                <div class="card shadow-sm ${esMia ? 'border-success border-2' : ''}">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="fs-4 text-center" style="width: 40px;">${medallas[i] && votos > 0 ? medallas[i] : (i + 1)}</div>
                        <img src="../Img/${r.img}" alt="${r.nombre}" class="rounded"
                             style="width: 64px; height: 64px; object-fit: cover;"
                             onerror="this.src='https://placehold.co/64x64?text=?'">
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between">
                                <strong>${r.nombre}${esMia ? ' <span class="badge bg-success">Tu voto</span>' : ''}</strong>
                                <span>${votos} voto${votos === 1 ? '' : 's'} (${pct}%)</span>
                            </div>
                            <div class="progress mt-2" style="height: 14px;">
                                <div class="progress-bar ${color}" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    </div>
                </div>`);
        });
    </script>
</body>
</html>
